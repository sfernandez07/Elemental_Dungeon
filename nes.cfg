# nes.cfg -- Linker script para NES con mapper NROM (mapper 0)
# Basado en el cfg oficial de cc65, adaptado para neslib + proyecto TFG

MEMORY {
    # Zero page: cc65 runtime (sp, ptr1-4...) + variables de neslib/famitone2
    ZP:     file = "",   start = $0002, size = $007E, type = rw;

    # iNES header: 16 bytes al inicio del fichero
    HEADER: file = %O,  start = $0000, size = $0010, fill = yes;

    # PRG-ROM codigo y datos: $8000-$FFF9 (32760 bytes, deja hueco para vectores)
    PRG:    file = %O,  start = $8000, size = $7FFA, fill = yes, fillval = $FF, define = yes;

    # Vectores hardware: NMI/RESET/IRQ en $FFFA-$FFFF
    VECMEM: file = %O,  start = $FFFA, size = $0006, fill = yes;

    # CHR-ROM: 8 KB de tiles
    CHR:    file = %O,  start = $0000, size = $2000, fill = yes;

    # RAM: $0200-$02FF OAM buf, $0300-$031F palette buf, $0320-$07FF juego + pila cc65
    RAM:    file = "",   start = $0320, size = $04E0, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = PRG,   type = ro, define = yes;
    CODE:     load = PRG,   type = ro;
    RODATA:   load = PRG,   type = ro;
    DATA:     load = PRG,   run = RAM, type = rw, define = yes;
    VECTORS:  load = VECMEM, type = ro;
    CHARS:    load = CHR,   type = ro, optional = yes;
    BSS:      load = RAM,   type = bss, define = yes;
}
